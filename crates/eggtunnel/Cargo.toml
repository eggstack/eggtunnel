[package]
name = "eggtunnel"
description = "Embeddable Eggtunnel reverse-session library"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/eggtunnel"
readme = "README.md"
keywords = ["reverse-tunnel", "proxy", "networking", "async"]
categories = ["network-programming"]

[features]
default = ["client", "tls"]
client = ["dep:tokio", "dep:tokio-util", "dep:eggress-core", "dep:eggress-transport-tls", "dep:eggress-relay", "dep:getrandom", "dep:rustls", "dep:tracing", "tls"]
server = ["dep:tokio", "dep:tokio-util", "dep:eggress-core", "dep:eggress-transport-tls", "dep:eggress-relay", "dep:rustls", "dep:tracing", "tls"]
tls = ["dep:eggress-transport-tls"]
# `quic` / `websocket` keep their published role-enabling umbrella meaning.
# Role-specific slices let an embedder compile a QUIC or WebSocket client
# without any server runtime code, and vice versa.
quic = ["quic-client", "quic-server"]
quic-client = ["client", "quic-transport"]
quic-server = ["server", "quic-transport"]
quic-transport = ["dep:eggress-transport-quic"]
websocket = ["websocket-client", "websocket-server"]
websocket-client = ["client", "websocket-transport"]
websocket-server = ["server", "websocket-transport"]
websocket-transport = ["dep:eggress-protocol-websocket", "dep:tokio-tungstenite"]
outbound-proxy = ["client", "dep:eggress-outbound"]
mtls = ["tls", "dep:tokio-rustls", "dep:webpki-roots", "dep:sha2"]

[dependencies]
eggtunnel-proto = { path = "../eggtunnel-proto", version = "0.2.0" }
tokio = { workspace = true, optional = true }
tokio-util = { workspace = true, optional = true }
eggress-core = { workspace = true, optional = true }
eggress-relay = { workspace = true, optional = true }
eggress-transport-tls = { workspace = true, optional = true }
eggress-transport-quic = { workspace = true, optional = true }
eggress-protocol-websocket = { workspace = true, optional = true }
eggress-outbound = { workspace = true, optional = true }
tokio-tungstenite = { workspace = true, optional = true }
subtle.workspace = true
zeroize.workspace = true
getrandom = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
tokio-rustls = { workspace = true, optional = true }
webpki-roots = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
thiserror.workspace = true
tracing = { workspace = true, optional = true }

[dev-dependencies]
rcgen = "0.13"
eggress-transport-quic = { workspace = true, features = ["insecure-quic"] }
