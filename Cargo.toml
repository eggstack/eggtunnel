[workspace]
resolver = "2"
members = ["crates/eggtunnel-proto", "crates/eggtunnel", "crates/eggtunnel-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/eggstack/eggtunnel"
homepage = "https://github.com/eggstack/eggtunnel"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["alloc"] }
thiserror = "2"
getrandom = "0.3"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
subtle = "2"
zeroize = "1"
eggress-core = "=1.0.8"
eggress-relay = "=1.0.8"
eggress-transport-tls = "=1.0.8"
eggress-transport-quic = { version = "=1.0.8", default-features = false }
eggress-protocol-websocket = { version = "=1.0.8", default-features = false }
eggress-outbound = { version = "=1.0.8", default-features = false, features = ["pproxy-compat"] }
tokio-tungstenite = { version = "0.26.2", default-features = false }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-pemfile = "2"
webpki-roots = "1"
sha2 = "0.10"
clap = { version = "4", features = ["derive"] }
toml = "0.8"
