# cargo-deny configuration: license policy for Eggtunnel.
#
# Policy: every third-party dependency must be under a permissive license.
# Licenses not listed in `allow` are denied (this includes GPL/AGPL/LGPL as a
# sole license). The full per-package inventory is generated by
# scripts/generate-third-party-notices.py; this file enforces the policy in CI
# via `cargo deny check licenses`.

[licenses]
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

# The following crates declare legacy `/`-separated license metadata that is
# not a valid SPDX expression. Each ships both named license texts; clarify to
# the equivalent SPDX expression, pinned by license-file hashes (first 32 bits
# of the file SHA-256, as reported by cargo-deny license diagnostics).

[[licenses.clarify]]
crate = "fnv"
expression = "Apache-2.0 OR MIT"
license-files = [
  { path = "LICENSE-APACHE", hash = 0xa60eea81 },
  { path = "LICENSE-MIT", hash = 0x65fdb6c7 },
]

[[licenses.clarify]]
crate = "same-file"
expression = "Unlicense OR MIT"
license-files = [
  { path = "UNLICENSE", hash = 0x7e12e5df },
  { path = "LICENSE-MIT", hash = 0xcb3c929a },
]

[[licenses.clarify]]
crate = "version_check"
expression = "Apache-2.0 OR MIT"
license-files = [
  { path = "LICENSE-APACHE", hash = 0xa60eea81 },
  { path = "LICENSE-MIT", hash = 0xb7e650f3 },
]

[[licenses.clarify]]
crate = "walkdir"
expression = "Unlicense OR MIT"
license-files = [
  { path = "UNLICENSE", hash = 0x7e12e5df },
  { path = "LICENSE-MIT", hash = 0x0f96a838 },
]
