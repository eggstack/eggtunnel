# Weekly supply-chain maintenance: Cargo updates and pinned GitHub Actions
# updates. Cadence is weekly (not daily) to avoid noisy churn; security
# updates still arrive through `cargo audit` in CI and Dependabot alerts.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
  - package-ecosystem: cargo
    directory: /fixtures/embedder
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    labels:
      - dependencies
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
